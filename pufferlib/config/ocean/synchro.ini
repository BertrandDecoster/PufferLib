[base]
package = ocean
env_name = puffer_synchro
policy_name = Synchro

[policy]
hidden_size = 256

[env]
num_envs = 4
rows = 5
cols = 5
num_agents = 2
num_synchro = 2
map_complexity = 0
horizon = 100

[vec]
num_envs = 8

[train]
device = mps
total_timesteps = 1_000_000
learning_rate = 0.0003
gamma = 0.99
gae_lambda = 0.95
clip_coef = 0.2
ent_coef = 0.01
vf_coef = 0.5
minibatch_size = 1024
