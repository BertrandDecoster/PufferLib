[base]
package = ocean
env_name = puffer_synchro
policy_name = SynchroD4V2

[policy]
hidden_size = 64

[env]
num_envs = 512
rows = 8
cols = 8
num_agents = 3
num_synchro = 3
map_complexity = 2
horizon = 50
overfit = false

[vec]
num_envs = 8

[train]
device = mps
total_timesteps = 500_000
learning_rate = 0.00467
gamma = 0.954
gae_lambda = 0.973
clip_coef = 0.40
ent_coef = 0.08
vf_coef = 1.12
vf_clip_coef = 3.84
prio_alpha = 0.86
update_epochs = 4
bptt_horizon = 16

[sweep]
method = Protein
metric = score
metric_distribution = linear
goal = maximize
max_suggestion_cost = 360
downsample = 5
use_gpu = True
prune_pareto = True
early_stop_quantile = 0.3
sweep_only = learning_rate, gamma, gae_lambda, clip_coef, ent_coef, vf_coef, vf_clip_coef, prio_alpha

[sweep.train.learning_rate]
distribution = log_normal
mean = 0.00467
min = 0.0002
max = 0.02


[sweep.train.gamma]
distribution = logit_normal
mean = 0.954
min = 0.8
max = 0.999


[sweep.train.gae_lambda]
distribution = logit_normal
mean = 0.973
min = 0.8
max = 0.999


[sweep.train.clip_coef]
distribution = uniform
mean = 0.2
min = 0.05
max = 0.5


[sweep.train.ent_coef]
distribution = log_normal
mean = 0.08
min = 0.01
max = 0.4


[sweep.train.vf_coef]
distribution = uniform
mean = 1.12
min = 0.5
max = 2.0


[sweep.train.vf_clip_coef]
distribution = uniform
mean = 3.84
min = 2.0
max = 8.0


[sweep.train.prio_alpha]
distribution = logit_normal
mean = 0.86
min = 0.1
max = 0.99



