[base]
package = ocean
env_name = puffer_synchroOld
policy_name = Synchro

[policy]
hidden_size = 256

[env]
num_envs = 4
rows = 5
cols = 5
num_agents = 2
num_synchro = 2
map_complexity = 0
horizon = 20
d4_transform = 0

[vec]
num_envs = 8

[train]
device = mps
total_timesteps = 300_000
learning_rate = 0.015
batch_size = 8192
minibatch_size = 512
gamma = 0.9973789848600498
gae_lambda = 0.8547904420063671
clip_coef = 0.13861829284578564
ent_coef = 0.0029874530280989712
vf_coef = 0.8236293318681418
vf_clip_coef = 1.5152918023988606
prio_alpha = 0.3

[sweep]
method = Protein
metric = score
metric_distribution = linear
goal = maximize
max_suggestion_cost = 180
downsample = 5
use_gpu = True
prune_pareto = True
early_stop_quantile = 0.3

[sweep.train.learning_rate]
distribution = log_normal
min = 0.001
max = 0.1
scale = 0.5

[sweep.train.gamma]
distribution = logit_normal
min = 0.9
max = 0.9999
scale = 0.5

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.6
max = 0.99
scale = 0.5

[sweep.train.clip_coef]
distribution = uniform
min = 0.05
max = 0.5
scale = 0.5

[sweep.train.ent_coef]
distribution = log_normal
min = 0.0001
max = 0.1
scale = 0.5

[sweep.train.vf_coef]
distribution = uniform
min = 0.1
max = 2.0
scale = 0.5

[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.1
max = 3.0
scale = 0.5

[sweep.train.prio_alpha]
distribution = logit_normal
min = 0.1
max = 0.9
scale = 0.5
